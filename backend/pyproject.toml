[project]
name = "safe-evac-route-backend"
version = "0.1.0"
description = "FastAPI backend for Safe Evac Route"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.12.0,<3",
    "uvicorn[standard]>=0.40.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "ruff>=0.15.1,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
